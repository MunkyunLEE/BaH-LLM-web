<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaH-LLM-web · 수식과 검증</title>
<style>
body { margin: 0; background: #0f141b; color: #dfe7f1; font: 14px/1.65 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; }
h1 { font-size: 24px; margin: 28px 0 10px; } h2 { font-size: 18px; margin: 28px 0 8px; color: #4cc2ff; }
table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 13px; }
th, td { border: 1px solid #2a3340; padding: 6px 8px; vertical-align: top; text-align: left; }
th { background: #18202b; } code { background: #18202b; padding: 1px 5px; border-radius: 4px; color: #ffd84a; }
nav a { color: #9fb3c8; margin-right: 14px; } li { margin: 4px 0; }
h3 { font-size: 15px; margin: 18px 0 6px; color: #ffd84a; } nav { position: sticky; top: 0; background: #0f141b; padding: 8px 0; border-bottom: 1px solid #2a3340; }
#ov h2:first-of-type + p { background: #18202b; border-left: 3px solid #4cc2ff; padding: 10px 14px; }
</style>
</head>
<body>
<main>
<nav><a href="index.html" id="nBack">← 앱으로</a><a href="#ov" id="nOv">이론 정리</a><a href="#eq" id="nEq">수식 대장</a><a href="#ver" id="nVer">검증 결과</a><a href="#" id="nLang" style="float:right">EN</a></nav>
<div id="ov"></div>
<div id="eq"></div>
<div id="ver"></div>
</main>
<script>
function inline(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function md(src) {
  const out = [];
  const L = src.split('\n');
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (/^#{1,3} /.test(l)) {
      const n = l.match(/^#+/)[0].length;
      out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`);
    } else if (l.startsWith('|')) {
      const rows = [];
      while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]);
      i--;
      const cells = (r) => r.slice(1, -1).split(' | ').map((c) => inline(c.trim()));
      out.push('<table><tr>' + cells(rows[0]).map((c) => `<th>${c}</th>`).join('') + '</tr>' + rows.slice(2).map((r) => '<tr>' + cells(r).map((c) => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>');
    } else if (/^(\d+\.|-) /.test(l)) {
      const items = [];
      const ol = /^\d+\./.test(l);
      while (i < L.length && /^(\d+\.|-) /.test(L[i])) items.push(L[i++].replace(/^(\d+\.|-) /, ''));
      i--;
      out.push(`<${ol ? 'ol' : 'ul'}>` + items.map((x) => `<li>${inline(x)}</li>`).join('') + `</${ol ? 'ol' : 'ul'}>`);
    } else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  return out.join('\n');
}
function lang() {
  try {
    const s = localStorage.getItem('bah-lang');
    if (s === 'ko' || s === 'en') return s;
  } catch (e) {}
  return /^ko/i.test((navigator.languages || [navigator.language])[0] || '') ? 'ko' : 'en';
}
const NAV = { ko: ['← 앱으로', '이론 정리', '수식 대장', '검증 결과', 'EN', 'BaH-LLM-web · 수식과 검증'], en: ['← Back to app', 'Theory', 'Equation ledger', 'Verification', 'KR', 'BaH-LLM-web · equations and verification'] };
async function load() {
  const L = lang();
  const sfx = L === 'ko' ? '' : '.en';
  document.documentElement.lang = L;
  ['nBack', 'nOv', 'nEq', 'nVer', 'nLang'].forEach((id, i) => (document.getElementById(id).textContent = NAV[L][i]));
  document.title = NAV[L][5];
  document.getElementById('ov').innerHTML = md(await (await fetch(`docs/overview${sfx}.md`)).text());
  document.getElementById('eq').innerHTML = md(await (await fetch(`docs/equations${sfx}.md`)).text());
  document.getElementById('ver').innerHTML = md(await (await fetch(`docs/verification${sfx}.md`)).text());
}
document.getElementById('nLang').onclick = (e) => {
  e.preventDefault();
  try {
    localStorage.setItem('bah-lang', lang() === 'ko' ? 'en' : 'ko');
  } catch (err) {}
  load();
};
load();
</script>
</body>
</html>
