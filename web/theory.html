<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaH-LLM-web · 수식과 검증</title>
<style>
body { margin: 0; background: #0f141b; color: #dfe7f1; font: 14px/1.65 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; }
h1 { font-size: 24px; margin: 28px 0 10px; } h2 { font-size: 18px; margin: 28px 0 8px; color: #4cc2ff; }
table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 13px; }
th, td { border: 1px solid #2a3340; padding: 6px 8px; vertical-align: top; text-align: left; }
th { background: #18202b; } code { background: #18202b; padding: 1px 5px; border-radius: 4px; color: #ffd84a; }
nav a { color: #9fb3c8; margin-right: 14px; } li { margin: 4px 0; }
</style>
</head>
<body>
<main>
<nav><a href="index.html">← 앱으로</a><a href="#eq">수식 대장</a><a href="#ver">검증 결과</a></nav>
<div id="eq"></div>
<div id="ver"></div>
</main>
<script>
function inline(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/`([^`]+)`/g, '<code>$1</code>');
}
function md(src) {
  const out = [];
  const L = src.split('\n');
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (/^#{1,3} /.test(l)) {
      const n = l.match(/^#+/)[0].length;
      out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`);
    } else if (l.startsWith('|')) {
      const rows = [];
      while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]);
      i--;
      const cells = (r) => r.slice(1, -1).split(' | ').map((c) => inline(c.trim()));
      out.push('<table><tr>' + cells(rows[0]).map((c) => `<th>${c}</th>`).join('') + '</tr>' + rows.slice(2).map((r) => '<tr>' + cells(r).map((c) => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>');
    } else if (/^(\d+\.|-) /.test(l)) {
      const items = [];
      const ol = /^\d+\./.test(l);
      while (i < L.length && /^(\d+\.|-) /.test(L[i])) items.push(L[i++].replace(/^(\d+\.|-) /, ''));
      i--;
      out.push(`<${ol ? 'ol' : 'ul'}>` + items.map((x) => `<li>${inline(x)}</li>`).join('') + `</${ol ? 'ol' : 'ul'}>`);
    } else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  return out.join('\n');
}
(async () => {
  document.getElementById('eq').innerHTML = md(await (await fetch('docs/equations.md')).text());
  document.getElementById('ver').innerHTML = md(await (await fetch('docs/verification.md')).text());
})();
</script>
</body>
</html>
